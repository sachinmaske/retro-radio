# Minimal MPD config for macOS (Homebrew). Copy to ~/.mpd/mpd.conf

music_directory     "~/Music"
playlist_directory  "~/.mpd/playlists"
db_file             "~/.mpd/database"
log_file            "~/.mpd/log"
pid_file            "~/.mpd/pid"
state_file          "~/.mpd/state"
sticker_file        "~/.mpd/sticker.sql"

bind_to_address     "127.0.0.1"
port                "6600"

decoder {
    plugin "ffmpeg"
}

audio_output {
    type "osx"
    name "Mac Speakers"
}
